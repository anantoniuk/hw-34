<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive</title>
  </head>
  <!-- нормаллайз -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <!-- лінк -->
  <link rel="stylesheet" href="./src/css/main.css" />
  <body>
    <header class="header">
      <div class="container header__container">
        <div class="header__top">
          <div class="logo"><span>LOGO</span></div>
          <button class="nav__btn">
            <svg class="btn__icon">
              <use href="./src/img/list.svg#icon-list" />
            </svg>
          </button>
        </div>
        <nav class="nav">
          <p class="nav__text">#nav</p>
        </nav>
      </div>
    </header>
    <main class="main">
      <div class="container main__container">
        <div class="main__content">#main</div>
        <aside class="main__aside">#aside</aside>
      </div>
    </main>
    <div class="container">
      <ul class="list">
        <li class="list__item"><p class="list__text">.column1</p></li>
        <li class="list__item"><p class="list__text">.column2</p></li>
        <li class="list__item"><p class="list__text">.column3</p></li>
        <li class="list__item"><p class="list__text">.column4</p></li>
        <li class="list__item"><p class="list__text">.column5</p></li>
        <li class="list__item"><p class="list__text">.column6</p></li>
      </ul>
    </div>
  </body>
</html>
